[project]
name = "hope"
version = "0.1.0"
description = "Hope: multi-agent grant automation platform (workspace root)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "services/*"]

[tool.uv.sources]
hope-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# Type-check sources only (like packages/core/src): service test dirs share module names
# (conftest, test_api, ...) that mypy would treat as duplicate top-level modules.
exclude = ["^services/[^/]+/tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
markers = ["db: requires the Postgres from infra/docker-compose.yml (HOPE_DATABASE_ADMIN_URL)"]
