[project]
name = "hope-core"
version = "0.1.0"
description = "Shared schemas, money type, pillar port, model gateway and DB helpers for Hope"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
]

[project.scripts]
hope-migrate = "hope_core.migrate:main"
hope-export-schemas = "hope_core.schemas.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hope_core"]
