[project]
name = "hope-core"
license = { text = "Proprietary" }
classifiers = ["Private :: Do Not Upload"]
version = "0.1.0"
description = "Shared schemas, money type, pillar port, model gateway and DB helpers for Hope"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pypdf>=5.0",
    "trafilatura>=1.12",
]

[project.scripts]
hope-migrate = "hope_core.migrate:main"
hope-export-schemas = "hope_core.schemas.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hope_core"]
