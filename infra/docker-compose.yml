name: hope

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hope
      POSTGRES_PASSWORD: hope
      POSTGRES_DB: hope
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hope -d hope"]
      interval: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=0.0.0.0:18081
    ports: ["19092:19092", "18081:18081"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  temporal:
    image: temporalio/temporal:1.4.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233"]
    ports: ["7233:7233", "8233:8233"]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: hope
      MINIO_ROOT_PASSWORD: hopehope
    ports: ["9000:9000", "9001:9001"]

volumes:
  pgdata:
