[project]
name = "hope-profile"
license = { text = "Proprietary" }
classifiers = ["Private :: Do Not Upload"]
version = "0.1.0"
description = "Agency Profile and Context Steward (A3): bitemporal profile versions and HITL-0 protected-field approvals"
requires-python = ">=3.12"
dependencies = [
    "hope-core",
    "fastapi>=0.115",
]

[tool.uv.sources]
hope-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hope_profile"]
