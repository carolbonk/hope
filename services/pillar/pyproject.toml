[project]
name = "hope-pillar"
version = "0.1.0"
description = "Grant Operations Pillar: router, Kafka/Postgres PillarPort, outbox relay, idempotent consumers, DLQ and the /v1 API"
requires-python = ">=3.12"
dependencies = [
    "hope-core",
    "hope-profile",
    "hope-discovery",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "confluent-kafka>=2.6",
    "redis>=5.2",
    "httpx>=0.27",
    "boto3>=1.35",
]

[project.scripts]
hope-pillar-relay = "hope_pillar.workers:relay"
hope-pillar-projector = "hope_pillar.workers:projector"
hope-demo-seed = "hope_pillar.demo:main"
hope-create-user = "hope_pillar.admin:main"

[tool.uv.sources]
hope-core = { workspace = true }
hope-profile = { workspace = true }
hope-discovery = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hope_pillar"]
