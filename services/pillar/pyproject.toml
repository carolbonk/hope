[project]
name = "hope-pillar"
version = "0.1.0"
description = "Grant Operations Pillar: router, Kafka/Postgres PillarPort, outbox relay, idempotent consumers, DLQ and the /v1 API"
requires-python = ">=3.12"
dependencies = [
    "hope-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "confluent-kafka>=2.6",
    "redis>=5.2",
    "httpx>=0.27",
]

[tool.uv.sources]
hope-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hope_pillar"]
