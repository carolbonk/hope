[project]
name = "hope-workflow"
license = { text = "Proprietary" }
classifiers = ["Private :: Do Not Upload"]
version = "0.1.0"
description = "Temporal OpportunityLifecycleWorkflow, HITL gates and Deadline and Notification agent (A12)"
requires-python = ">=3.12"
dependencies = [
    "hope-core",
    "temporalio>=1.8",
]

[tool.uv.sources]
hope-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hope_workflow"]
