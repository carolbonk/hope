[project]
name = "hope-budget"
license = { text = "Proprietary" }
classifiers = ["Private :: Do Not Upload"]
version = "0.1.0"
description = "Budget Engine and Budget and Scope Framework Generator (A7) plus numeric reconciler"
requires-python = ">=3.12"
dependencies = [
    "hope-core",
    "ortools>=9.11",
]

[tool.uv.sources]
hope-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hope_budget"]
