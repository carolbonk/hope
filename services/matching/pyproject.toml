[project]
name = "hope-matching"
license = { text = "Proprietary" }
classifiers = ["Private :: Do Not Upload"]
version = "0.1.0"
description = "Eligibility, mission alignment and recommendation agents (A4, A5, A6)"
requires-python = ">=3.12"
dependencies = [
    "hope-core",
    "numpy>=2.1",
    "rank-bm25>=0.2.2",
]

[tool.uv.sources]
hope-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hope_matching"]
