[project]
name = "hope-ingestion"
version = "0.1.0"
description = "Discovery and RFP parsing agents (A1, A2): source connectors, artifact store, dedup, normalization"
requires-python = ">=3.12"
dependencies = [
    "hope-core",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "datasketch>=2.0",
    "boto3>=1.35",
    "beautifulsoup4>=4.12",
]

[tool.uv.sources]
hope-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hope_ingestion"]
