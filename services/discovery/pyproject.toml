[project]
name = "hope-discovery"
license = { text = "Proprietary" }
classifiers = ["Private :: Do Not Upload"]
version = "0.1.0"
description = "Grant discovery (H2): plans searches, reads grant pages and stores cited GrantCandidates"
requires-python = ">=3.12"
dependencies = [
    "hope-core",
]

[tool.uv.sources]
hope-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hope_discovery"]
