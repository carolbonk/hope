name: Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/schemas/ts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'infra/hf-space/**'
      - '.github/workflows/hf-space.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'carolbonk/hope'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Skip without HF_TOKEN and HF_SPACE
        if: env.HF_TOKEN == '' || env.HF_SPACE == ''
        run: echo "::notice::Set the HF_TOKEN secret and HF_SPACE variable (e.g. user/hope) to deploy the Space."
      - uses: actions/checkout@v4
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
      - uses: pnpm/action-setup@v4
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
      - uses: actions/setup-node@v4
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        with:
          node-version: 22
          cache: pnpm
      - name: Build and upload
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: bash infra/hf-space/deploy.sh
