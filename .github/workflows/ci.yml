name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hope
          POSTGRES_PASSWORD: hope
          POSTGRES_DB: hope
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hope -d hope" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 19092:19092 redpandadata/redpanda:v24.2.7 \
            redpanda start --mode=dev-container --smp=1 \
            --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092 \
            --advertise-kafka-addr=internal://localhost:9092,external://localhost:19092
          for i in $(seq 1 30); do docker exec redpanda rpk cluster health | grep -q 'Healthy:.*true' && exit 0; sleep 2; done
          docker logs redpanda; exit 1
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - name: Create dev DB roles
        run: psql postgresql://hope:hope@localhost:5432/hope -f infra/postgres/init-roles.sql
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy packages/core/src services
      - run: uv run hope-migrate
      - run: uv run pytest -q
      - name: Exported schemas are committed
        run: uv run hope-export-schemas && git diff --exit-code packages/schemas/json

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run test
      - name: Generated TS types are committed
        run: pnpm --filter @hope/schemas run gen && git diff --exit-code packages/schemas/ts
